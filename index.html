<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fridge Manager - Controle de Geladeira</title>
    <style>
        :root {
            --color-white: rgba(255, 255, 255, 1);
            --color-cream-50: rgba(252, 252, 249, 1);
            --color-gray-200: rgba(245, 245, 245, 1);
            --color-gray-300: rgba(167, 169, 169, 1);
            --color-slate-500: rgba(98, 108, 113, 1);
            --color-slate-900: rgba(19, 52, 59, 1);
            --color-teal-300: rgba(50, 184, 198, 1);
            --color-teal-500: rgba(33, 128, 141, 1);
            --color-teal-600: rgba(29, 116, 128, 1);
            --color-red-400: rgba(255, 84, 89, 1);
            --color-orange-500: rgba(168, 75, 47, 1);
            --color-green-500: rgba(34, 197, 94, 1);

            --color-background: var(--color-cream-50);
            --color-surface: var(--color-white);
            --color-text: var(--color-slate-900);
            --color-primary: var(--color-teal-500);
            --color-primary-hover: var(--color-teal-600);
            --color-border: rgba(98, 108, 113, 0.2);
            --color-success: var(--color-green-500);
            --color-warning: var(--color-orange-500);
            --color-error: var(--color-red-400);

            --space-8: 8px;
            --space-12: 12px;
            --space-16: 16px;
            --space-20: 20px;
            --space-24: 24px;
            --radius-base: 8px;
            --radius-lg: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: var(--space-16);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: var(--space-24);
            padding-bottom: var(--space-16);
            border-bottom: 2px solid var(--color-border);
        }

        h1 {
            margin: 0 0 var(--space-8) 0;
            font-size: 28px;
            color: var(--color-primary);
        }

        .subtitle {
            color: var(--color-slate-500);
            font-size: 14px;
        }

        .input-section {
            background: var(--color-surface);
            padding: var(--space-20);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-20);
            border: 1px solid var(--color-border);
        }

        .form-group {
            margin-bottom: var(--space-16);
        }

        label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: var(--space-8);
            color: var(--color-text);
        }

        input, select, textarea {
            width: 100%;
            padding: var(--space-12);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            font-size: 14px;
            font-family: inherit;
            color: var(--color-text);
            background: var(--color-surface);
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid var(--color-primary);
            outline-offset: -1px;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-16);
        }

        .btn {
            padding: var(--space-12) var(--space-20);
            border: none;
            border-radius: var(--radius-base);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--color-primary);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--color-primary-hover);
        }

        .btn-small {
            padding: var(--space-8) var(--space-12);
            font-size: 12px;
            width: auto;
        }

        .btn-danger {
            background: var(--color-error);
            color: white;
        }

        .btn-danger:hover {
            background: rgba(255, 84, 89, 0.9);
        }

        .btn-success {
            background: var(--color-success);
            color: white;
        }

        .btn-success:hover {
            background: rgba(34, 197, 94, 0.9);
        }

        .items-section {
            display: flex;
            gap: var(--space-16);
            margin-bottom: var(--space-20);
        }

        .items-list {
            flex: 1;
            background: var(--color-surface);
            padding: var(--space-20);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
        }

        .items-list h2 {
            margin: 0 0 var(--space-16) 0;
            font-size: 18px;
            color: var(--color-text);
        }

        .search-box {
            margin-bottom: var(--space-16);
        }

        .search-box input {
            width: 100%;
        }

        .item {
            background: var(--color-background);
            padding: var(--space-12);
            border-radius: var(--radius-base);
            margin-bottom: var(--space-12);
            border-left: 4px solid var(--color-primary);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .item.expiring-soon {
            border-left-color: var(--color-warning);
            background: rgba(168, 75, 47, 0.08);
        }

        .item.expired {
            border-left-color: var(--color-error);
            background: rgba(255, 84, 89, 0.08);
        }

        .item-content {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: var(--space-4);
        }

        .item-details {
            font-size: 13px;
            color: var(--color-slate-500);
            margin-bottom: var(--space-4);
        }

        .item-notes {
            font-size: 12px;
            color: var(--color-slate-500);
            font-style: italic;
            margin-top: var(--space-8);
        }

        .status-badge {
            display: inline-block;
            padding: var(--space-4) var(--space-8);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: var(--space-8);
        }

        .status-ok {
            background: rgba(34, 197, 94, 0.2);
            color: var(--color-success);
        }

        .status-warning {
            background: rgba(168, 75, 47, 0.2);
            color: var(--color-warning);
        }

        .status-expired {
            background: rgba(255, 84, 89, 0.2);
            color: var(--color-error);
        }

        .item-actions {
            display: flex;
            gap: var(--space-8);
            margin-top: var(--space-12);
        }

        .stats {
            width: 250px;
            background: var(--color-surface);
            padding: var(--space-20);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            height: fit-content;
            position: sticky;
            top: var(--space-16);
        }

        .stats h3 {
            margin: 0 0 var(--space-16) 0;
            font-size: 16px;
            color: var(--color-text);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: var(--space-12) 0;
            border-bottom: 1px solid var(--color-border);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            font-size: 13px;
            color: var(--color-slate-500);
        }

        .stat-value {
            font-weight: 600;
            font-size: 16px;
        }

        .empty-state {
            text-align: center;
            padding: var(--space-24);
            color: var(--color-slate-500);
        }

        .empty-state p {
            margin: 0;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .items-section {
                flex-direction: column;
            }

            .stats {
                width: 100%;
                position: static;
            }

            header {
                margin-bottom: var(--space-16);
            }

            h1 {
                font-size: 24px;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: var(--space-12);
            }

            .input-section {
                padding: var(--space-16);
            }

            .items-list {
                padding: var(--space-16);
            }

            .item {
                flex-direction: column;
            }

            .item-actions {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧊 Gerenciamento da Nossa Geladeira 🐕‍🦺</h1>
            <p class="subtitle">Um protótipo da Sofilda para o Gustávio</p>
        </header>

        <div class="input-section">
            <h2 style="margin-top: 0; font-size: 18px;">Adicionar Alimento</h2>
            
            <div class="form-group">
                <label for="itemName">Nome do Alimento *</label>
                <input type="text" id="itemName" placeholder="Ex: Leite integral, Frango congelado..." required>
            </div>

            <div class="form-group">
                <label for="entryDate">Quando foi feito/comprado? *</label>
                <input type="date" id="entryDate" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="expiryDate">Data de Validade *</label>
                    <input type="date" id="expiryDate" required>
                </div>
                <div class="form-group">
                    <label for="quantity">Quantidade</label>
                    <input type="text" id="quantity" placeholder="Ex: 1L, 500g, 2 unidades">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="category">Categoria</label>
                    <select id="category">
                        <option value="">Selecionar categoria</option>
                        <option value="Laticínios">Laticínios</option>
                        <option value="Carnes">Carnes</option>
                        <option value="Vegetais">Vegetais</option>
                        <option value="Frutas">Frutas</option>
                        <option value="Grãos">Grãos</option>
                        <option value="Condimentos">Condimentos</option>
                        <option value="Bebidas">Bebidas</option>
                        <option value="Congelado">Congelado</option>
                        <option value="Sobremesas">Sobremesas</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="notes">Observações</label>
                <textarea id="notes" placeholder="Ex: Aberto em 15/11, Já usado 1/4..."></textarea>
            </div>

            <button class="btn btn-primary" onclick="addItem()">+ Adicionar à Geladeira</button>
        </div>

        <div class="items-section">
            <div class="items-list">
                <h2>Itens na Geladeira</h2>
                
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Buscar alimento..." onkeyup="filterItems()">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-12); margin-bottom: var(--space-16);">
                    <select id="categoryFilter" onchange="filterItems()" style="width: 100%;">
                        <option value="">Filtro: Todas categorias</option>
                        <option value="Laticínios">Laticínios</option>
                        <option value="Carnes">Carnes</option>
                        <option value="Vegetais">Vegetais</option>
                        <option value="Frutas">Frutas</option>
                        <option value="Grãos">Grãos</option>
                        <option value="Condimentos">Condimentos</option>
                        <option value="Bebidas">Bebidas</option>
                        <option value="Congelado">Congelado</option>
                        <option value="Sobremesas">Sobremesas</option>
                        <option value="Outros">Outros</option>
                    </select>
                    <select id="statusFilter" onchange="filterItems()" style="width: 100%;">
                        <option value="">Filtro: Todos status</option>
                        <option value="ok">Em dia</option>
                        <option value="expiring">Vencendo em breve</option>
                        <option value="expired">Vencidos</option>
                    </select>
                </div>

                <div id="itemsList"></div>

                <div class="shopping-list">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-16);">
                        <h2 style="margin: 0;">🛍️ Lista de Compras</h2>
                        <button class="btn btn-small btn-danger" onclick="clearShoppingList()" style="display: ${loadShoppingList().length > 0 ? 'block' : 'none'};">Limpar</button>
                    </div>
                    <div id="shoppingListContent"></div>
                </div>
            </div>

            <div class="stats">
                <h3>📊 Resumo</h3>
                <div class="stat-item">
                    <span class="stat-label">Total de itens</span>
                    <span class="stat-value" id="totalItems">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Vencidos</span>
                    <span class="stat-value" style="color: var(--color-error);" id="expiredCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Vencendo em breve</span>
                    <span class="stat-value" style="color: var(--color-warning);" id="expiringCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Em dia</span>
                    <span class="stat-value" style="color: var(--color-success);" id="goodCount">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Gerenciamento de dados no localStorage
        function loadItems() {
            const stored = localStorage.getItem('fridgeItems');
            return stored ? JSON.parse(stored) : [];
        }

        function saveItems(items) {
            localStorage.setItem('fridgeItems', JSON.stringify(items));
            renderItems();
            updateStats();
        }

        function addItem() {
            const name = document.getElementById('itemName').value.trim();
            const expiryDate = document.getElementById('expiryDate').value;
            const quantity = document.getElementById('quantity').value.trim();
            const category = document.getElementById('category').value || 'Outros';
            const entryDate = document.getElementById('entryDate').value;
            const notes = document.getElementById('notes').value.trim();

            if (!name || !expiryDate || !entryDate) {
                alert('Por favor, preencha nome, data de validade e quando foi feito/comprado!');
                return;
            }

            const items = loadItems();
            const item = {
                id: Date.now(),
                name,
                expiryDate,
                quantity,
                category,
                entryDate,
                notes,
                dateAdded: new Date().toISOString()
            };

            items.push(item);
            saveItems(items);

            // Limpar formulário
            document.getElementById('itemName').value = '';
            document.getElementById('expiryDate').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('category').value = '';
            document.getElementById('entryDate').value = '';
            document.getElementById('notes').value = '';
            document.getElementById('itemName').focus();
        }

        function deleteItem(id) {
            if (confirm('Tem certeza que deseja remover este item?')) {
                const items = loadItems().filter(item => item.id !== id);
                saveItems(items);
            }
        }

        function markAsUsed(id) {
            const items = loadItems();
            const item = items.find(i => i.id === id);
            
            if (item && confirm(`Deseja adicionar "${item.name}" à lista de compras?`)) {
                addToShoppingList(item.name);
            }
            
            const updatedItems = items.filter(i => i.id !== id);
            saveItems(updatedItems);
        }

        function loadShoppingList() {
            const stored = localStorage.getItem('shoppingList');
            return stored ? JSON.parse(stored) : [];
        }

        function saveShoppingList(items) {
            localStorage.setItem('shoppingList', JSON.stringify(items));
            renderShoppingList();
        }

        function addToShoppingList(itemName) {
            const list = loadShoppingList();
            if (!list.includes(itemName)) {
                list.push(itemName);
                saveShoppingList(list);
                alert(`"${itemName}" adicionado à lista de compras! ✓`);
            }
        }

        function removeFromShoppingList(itemName) {
            const list = loadShoppingList().filter(item => item !== itemName);
            saveShoppingList(list);
        }

        function renderShoppingList() {
            const list = loadShoppingList();
            const shoppingListDiv = document.getElementById('shoppingListContent');
            
            if (list.length === 0) {
                shoppingListDiv.innerHTML = '<div class="empty-state"><p>Lista de compras vazia 🛍️</p></div>';
                return;
            }

            shoppingListDiv.innerHTML = list.map(item => `
                <div class="shopping-item">
                    <div class="shopping-item-name">${item}</div>
                    <button class="btn btn-small btn-danger" onclick="removeFromShoppingList('${item.replace(/'/g, "\\'")}')">✕ Remover</button>
                </div>
            `).join('');
        }

        function clearShoppingList() {
            if (confirm('Tem certeza que deseja limpar a lista de compras?')) {
                localStorage.setItem('shoppingList', JSON.stringify([]));
                renderShoppingList();
            }
        }

        function getStatusInfo(expiryDate) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const expiry = new Date(expiryDate + 'T00:00:00');
            const daysLeft = Math.floor((expiry - today) / (1000 * 60 * 60 * 24));

            if (daysLeft < 0) {
                return { status: 'expired', label: `Vencido há ${Math.abs(daysLeft)} dias`, class: 'expired', badge: 'status-expired' };
            } else if (daysLeft <= 3) {
                return { status: 'expiring', label: `Vence em ${daysLeft} dias`, class: 'expiring-soon', badge: 'status-warning' };
            } else {
                return { status: 'ok', label: `Vence em ${daysLeft} dias`, class: '', badge: 'status-ok' };
            }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('pt-BR');
        }

        function renderItems() {
            const items = loadItems();
            const itemsList = document.getElementById('itemsList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            const filtered = items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchTerm) ||
                    item.category.toLowerCase().includes(searchTerm);
                
                const matchesCategory = !categoryFilter || item.category === categoryFilter;
                
                const statusInfo = getStatusInfo(item.expiryDate);
                const matchesStatus = !statusFilter || statusInfo.status === statusFilter;
                
                return matchesSearch && matchesCategory && matchesStatus;
            });

            if (filtered.length === 0) {
                itemsList.innerHTML = '<div class="empty-state"><p>Nenhum alimento encontrado 🛒</p></div>';
                return;
            }

            // Ordenar por data de validade (próximos primeiro)
            filtered.sort((a, b) => new Date(a.expiryDate) - new Date(b.expiryDate));

            itemsList.innerHTML = filtered.map(item => {
                const statusInfo = getStatusInfo(item.expiryDate);
                return `
                    <div class="item ${statusInfo.class}">
                        <div class="item-content">
                            <div class="item-name">${item.name}</div>
                            <div class="item-details">
                                📅 Validade: ${formatDate(item.expiryDate)}
                                ${item.entryDate ? ` • Entry: ${formatDate(item.entryDate)}` : ''}
                                ${item.quantity ? ` • ${item.quantity}` : ''}
                                ${item.category ? ` • ${item.category}` : ''}
                            </div>
                            ${item.notes ? `<div class="item-notes">Nota: ${item.notes}</div>` : ''}
                            <div class="status-badge ${statusInfo.badge}">${statusInfo.label}</div>
                        </div>
                        <div class="item-actions">
                            <button class="btn btn-small btn-success" onclick="markAsUsed(${item.id})">✓ Usado</button>
                            <button class="btn btn-small btn-danger" onclick="deleteItem(${item.id})">✕ Remover</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterItems() {
            renderItems();
        }

        function updateStats() {
            const items = loadItems();
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let expired = 0, expiring = 0, good = 0;

            items.forEach(item => {
                const expiry = new Date(item.expiryDate + 'T00:00:00');
                const daysLeft = Math.floor((expiry - today) / (1000 * 60 * 60 * 24));

                if (daysLeft < 0) {
                    expired++;
                } else if (daysLeft <= 3) {
                    expiring++;
                } else {
                    good++;
                }
            });

            document.getElementById('totalItems').textContent = items.length;
            document.getElementById('expiredCount').textContent = expired;
            document.getElementById('expiringCount').textContent = expiring;
            document.getElementById('goodCount').textContent = good;
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            // Pré-preenchimento da data de entry com data atual
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('entryDate').value = today;
            
            renderItems();
            updateStats();
            renderShoppingList();
        });

        // Permitir Enter para adicionar item
        document.getElementById('itemName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('expiryDate').focus();
            }
        });

        document.getElementById('expiryDate').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addItem();
            }
        });
    </script>
</body>
</html>
